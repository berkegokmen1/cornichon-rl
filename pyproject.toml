[project]
name = "cornichon-rl"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0", "numpy>=1.26", "torch>=2.5", "wandb>=0.19", "wandb-workspaces", "pyyaml>=6", "pillow"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
